<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云锦工坊 · 接单打样交付台</title>
<style>
:root{
  --ink:#2c211a; --muted:#857565; --paper:#fbf6ec; --card:#fffdf7; --line:#e2d4be;
  --red:#9c3b2f; --red-d:#7d2c22; --gold:#b8873e; --green:#3f6b47; --green-d:#315237;
  --slate:#5d6b78; --amber:#b5762a; --bad-bg:#fbece9; --ok-bg:#eef5ee; --warn-bg:#fbf2e2;
}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
header{background:linear-gradient(100deg,#4a2420,#7d2c22 55%,#9c3b2f);color:#fdf3e3;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:22px;letter-spacing:2px}
header .sub{font-size:12px;opacity:.82;margin-top:3px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
nav{display:flex;gap:4px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;overflow-x:auto}
nav button{border:0;background:none;padding:13px 16px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:var(--red);border-bottom-color:var(--gold)}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
nav .badge.warn{background:var(--amber)}
main{padding:18px 22px;max-width:1400px;margin:0 auto}
.page{display:none}
.page.active{display:block}
h2{font-size:16px;margin:18px 0 10px;padding-left:9px;border-left:4px solid var(--gold)}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.metric b{font-size:26px;color:var(--red);display:block}
.metric span{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f4ebdb;color:#6b5a47;font-weight:700;white-space:nowrap}
tr:hover td{background:#fdf8f0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
button.act{border:1px solid var(--red);background:#fff;color:var(--red);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;margin:2px 3px 2px 0;white-space:nowrap}
button.act:hover{background:var(--red);color:#fff}
button.act.g{border-color:var(--green);color:var(--green)} button.act.g:hover{background:var(--green);color:#fff}
button.act.s{border-color:var(--slate);color:var(--slate)} button.act.s:hover{background:var(--slate);color:#fff}
button.act.danger{border-color:#b04a3c;color:#b04a3c} button.act.danger:hover{background:#b04a3c;color:#fff}
button.act[disabled]{opacity:.4;cursor:not-allowed;background:#f3ece1;color:#aaa;border-color:#ddd}
button.act[disabled]:hover{background:#f3ece1;color:#aaa}
button.primary{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer;font-size:14px}
button.primary:hover{background:var(--red-d)}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
button.ghost:hover{border-color:var(--gold)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto}
input,select,textarea{width:100%;border:1px solid #d6c6ac;border-radius:7px;padding:9px 10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
label{display:block;margin:11px 0 4px;color:#6b5a47;font-size:12px;font-weight:700}
label .req{color:var(--red)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.chip.draft,.chip.created{background:#ece6db;color:#7a6c59}
.chip.sent,.chip.scheduled,.chip.partial,.chip.rework{background:#e8eef5;color:#3d5873}
.chip.feedback{background:#f3ece0;color:#8a5a1d}
.chip.passed,.chip.done,.chip.completed,.chip.qcpassed,.chip.delivered,.chip.instock{background:var(--ok-bg);color:var(--green-d)}
.chip.rejected,.chip.overdue,.chip.cancelled,.chip.qcfail,.chip.qcfailed{background:var(--bad-bg);color:var(--red-d)}
.chip.picked,.chip.weaving,.chip.producing{background:var(--warn-bg);color:#8a5a1d}
.chip.qc{background:#efe9f3;color:#6a4580}
.chip.new{background:#ece6db;color:#7a6c59}
.muted{color:var(--muted)}
.small{font-size:12px}
.due-late{color:var(--red-d);font-weight:800}
.due-soon{color:var(--amber);font-weight:700}
.todo-row{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.todo-row:hover{background:#fdf8f0}
.todo-row:last-child{border-bottom:0}
.todo-type{font-size:11px;color:#fff;background:var(--slate);border-radius:5px;padding:1px 7px;white-space:nowrap}
.todo-type.red{background:var(--red)} .todo-type.amber{background:var(--amber)} .todo-type.green{background:var(--green)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.thread{display:inline-flex;align-items:center;gap:5px;margin:2px 6px 2px 0;font-size:12px;background:#f6efe2;border:1px solid var(--line);border-radius:16px;padding:2px 10px 2px 4px}
.thread i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
.thread b{font-weight:800}
.lowstock{color:var(--red-d);font-weight:800}
.okstock{color:var(--green-d)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.modal-mask{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:12px;width:min(680px,100%);max-height:90vh;display:flex;flex-direction:column;border-top:5px solid var(--gold)}
.modal h3{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);font-size:16px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
.modal .body{padding:6px 18px 12px;overflow-y:auto;flex:1 1 auto;min-height:0}
.modal .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto}
.x{cursor:pointer;border:0;background:none;font-size:20px;color:var(--muted);line-height:1}
.formerr{background:var(--bad-bg);color:var(--red-d);border:1px solid #e3b7af;border-radius:7px;padding:9px 12px;margin-top:12px;font-weight:700;display:none}
.formerr.show{display:block}
.qrow{display:grid;grid-template-columns:1fr 90px 70px;gap:8px;align-items:center;margin-bottom:8px}
.qrow select,.qrow input{padding:7px}
.bar{height:8px;background:#eee1cd;border-radius:5px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.amber{background:var(--amber)} .bar i.red{background:var(--red)}
.flow-in{color:var(--green-d);font-weight:800}
.flow-out{color:var(--red-d);font-weight:800}
.flow-zero{color:var(--slate);font-weight:800}
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:#3a2c22;color:#fdf3e3;padding:11px 16px;border-radius:9px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:380px;animation:tin .2s}
.toast.ok{background:var(--green-d)} .toast.err{background:var(--red-d)}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.logline{border-left:3px solid var(--line);padding:5px 10px;margin:6px 0;font-size:12px;background:#f8f2e7;border-radius:0 6px 6px 0}
.logline b{color:var(--red)}
hr{border:0;border-top:1px dashed var(--line);margin:14px 0}
.section-note{font-size:12px;color:var(--muted);margin:4px 0 10px}
</style>
</head>
<body>
<header>
  <div>
    <h1>云锦工坊 · 接单打样交付台</h1>
    <div class="sub">订单接单 → 多版打样确认 → 色线领料 · 机台排产 → 完工质检 → 批次交付（数据保存在本机浏览器）</div>
  </div>
  <div class="hbtns">
    <button class="ghost" style="color:#fdf3e3;border-color:#cfa86a" onclick="exportData()">⬇ 导出备份</button>
    <button class="ghost" style="color:#fdf3e3;border-color:#cfa86a" onclick="document.getElementById('importFile').click()">⬆ 导入还原</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    <button class="ghost" style="color:#fdf3e3;border-color:#cfa86a" onclick="resetDemo()">↺ 重置为演示数据</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toasts"></div>

<script>
"use strict";
/* ================= 常量 ================= */
const STORE_KEY = "brocadeWorkshopV1";
const TABS = [
  {id:"home",     name:"总览"},
  {id:"orders",   name:"客户订单"},
  {id:"proofs",   name:"打样确认"},
  {id:"batches",  name:"生产批次"},
  {id:"stock",    name:"色线库存"},
  {id:"delivery", name:"批次交付"},
];
const THREAD_COLORS = ["#7d2c22","#1f5f78","#b8873e","#355b38","#4a3b6b","#2b2723","#c9c2b2","#b54a33"];
const FLOW_TYPES = {
  opening:   {label:"期初入库", sign:1},
  instock:   {label:"采购入库", sign:1},
  pick:      {label:"领料出库", sign:-1},
  consume:   {label:"耗用登记", sign:0},
  return:    {label:"余线退库", sign:1},
  cancel:    {label:"取消退回", sign:1},
  adjust:    {label:"盘点调整", sign:1},
};
/* 批次状态流：created 待排产 → scheduled 已排产 → picked 已领料 → producing 织造中
   → completed 待质检 → qcpassed 质检合格 / qcfailed 返工 → completed … → delivered / cancelled */
const BATCH_STATUS = {
  created:   "待排产",
  scheduled: "已排产",
  picked:    "已领料",
  producing: "织造中",
  completed: "待质检",
  qcpassed:  "质检合格",
  qcfailed:  "返工中",
  delivered: "已交付",
  cancelled: "已取消",
};

/* ================= 状态 ================= */
let state = null;
let ui = {tab:"home", orderFilter:"", proofFilter:"", batchFilter:"", stockThread:"", flowType:"", deliveryFilter:""};

function freshState(){
  return {
    version:1,
    seq:{order:0, proof:0, batch:0, delivery:0, thread:0, machine:0},
    threads: [], machines: [], orders: [],
    proofs: [], versions: [], batches: [], deliveries: [], flows: [],
  };
}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const todayISO = () => new Date().toISOString().slice(0,10);
function offsetDate(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ const n = Number(v); return Number.isFinite(n)?n:0; }function qty(n){ return num(n).toLocaleString("zh-CN",{maximumFractionDigits:2}); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function genNo(kind, prefix, pad=3){
  state.seq[kind] = (state.seq[kind]||0)+1;
  const ym = todayISO().slice(2,7).replace("-","");
  return prefix + ym + String(state.seq[kind]).padStart(pad,"0");
}
function find(a,id){ return a.find(x=>x.id===id); }
/* 统一从弹窗表单取值（兼容 jsdom 及真实浏览器，避免 form.xxx 直接访问的差异/命名冲突）；
   也兼容直接传入普通对象的调用方式 */
function fv(form,name){
  if(form && form.elements){
    const col=form.elements;
    const el=col.namedItem?col.namedItem(name):col[name];
    if(el!=null) return el.value==null ? "" : String(el.value);
  }
  if(form && form[name]!=null) return String(form[name]);
  return "";
}
function formVals(form){
  const out={};
  form.querySelectorAll("input,select,textarea").forEach(el=>{
    if(el.name && !(el.name in out)) out[el.name]=fv(form,el.name);
  });
  return out;
}
function toast(msg, kind){
  const el=document.createElement("div");
  el.className="toast "+(kind||"");
  el.textContent=msg;
  $("#toasts").appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .4s";setTimeout(()=>el.remove(),400);},2600);
}
function fail(msg){ const e=new Error(msg); e._user=true; return e; }

/* ---------- 派生数据 ---------- */
function versionsOf(proofId){ return state.versions.filter(v=>v.proofId===proofId).sort((a,b)=>a.no-b.no); }
function activeVersion(proof){
  const vs = versionsOf(proof.id);
  return vs.find(v=>v.status==="passed") || vs[vs.length-1] || null;
}
function proofOf(orderId){ return state.proofs.find(p=>p.orderId===orderId); }
function orderBatches(orderId){ return state.batches.filter(b=>b.orderId===orderId && b.status!=="cancelled"); }
function orderDeliveries(orderId){
  const ids = new Set(orderBatches(orderId).map(b=>b.id));
  return state.deliveries.filter(d=>ids.has(d.batchId));
}
function orderStats(o){
  const proof = proofOf(o.id);
  const batches = orderBatches(o.id);
  const scheduledQty = batches.reduce((s,b)=>s+num(b.qty),0);
  const finishedQty = batches.filter(b=>["qcpassed","delivered"].includes(b.status)).reduce((s,b)=>s+num(b.qty),0);
  const deliveredQty = orderDeliveries(o.id).reduce((s,d)=>s+num(d.qty),0);
  const latest = proof ? activeVersion(proof) : null;
  let status = "new";
  if (deliveredQty >= num(o.qty)) status = "done";
  else if (batches.some(b=>b.status==="producing"||b.status==="picked")) status = "producing";
  else if (batches.length) status = "scheduled";
  else if (latest && latest.status==="passed") status = "approved";
  else if (proof && latest) status = "proofing";
  return {proof, batches, latest, scheduledQty, finishedQty, deliveredQty,
    remainSchedule: num(o.qty)-scheduledQty, status};
}
const ORDER_STATUS_LABEL = {new:"待打样", proofing:"打样中", approved:"已确认待排产", scheduled:"已排产", producing:"织造中", done:"已完结"};
function orderStatusChip(o){
  const s = orderStats(o);
  let cls = s.status;
  if (s.status==="done") cls="passed";
  if (s.status==="producing") cls="producing";
  if (s.status==="scheduled") cls="scheduled";
  if (s.status==="approved") cls="feedback";
  if (s.status==="proofing") cls="sent";
  return '<span class="chip '+cls+'">'+ORDER_STATUS_LABEL[s.status]+'</span>';
}
function proofStatusOf(proof){
  const v = activeVersion(proof);
  if (!v) return {key:"draft", label:"待建样"};
  if (v.status==="passed") return {key:"passed", label:"已通过"};
  if (v.status==="rejected") return {key:"rejected", label:"已退样·可重打"};
  if (v.status==="sent") return {key:"sent", label:"已送样·待反馈"};
  if (v.status==="feedback") return {key:"feedback", label:"已反馈"};
  return {key:"draft", label:"草稿"};
}
function threadBalance(threadId){
  return state.flows.filter(f=>f.threadId===threadId)
    .reduce((s,f)=> s + (FLOW_TYPES[f.type]?FLOW_TYPES[f.type].sign*num(f.qty):0), 0);
}
function versionReqs(v){ return (v.requirements||[]).filter(r=>r.threadId && num(r.qty)>0); }
/* 确认样登记单件用量；批次总需求 = 单件用量 × 批次数量（保留4位避免误差） */
function batchRequirements(batch){
  const proof = proofOf(batch.orderId);
  if (!proof) return [];
  const v = activeVersion(proof);
  if (!v) return [];
  const q = num(batch.qty);
  return versionReqs(v).map(r=>({
    threadId:r.threadId,
    qty: Math.round(num(r.qty)*q*10000)/10000,
    unit: r.unit||"克",
  }));
}
function pickedMap(batch){ const m={}; (batch.picks||[]).forEach(p=>m[p.threadId]=(m[p.threadId]||0)+num(p.qty)); return m; }
function consumedMap(batch){ const m={}; (batch.consumes||[]).forEach(p=>m[p.threadId]=(m[p.threadId]||0)+num(p.qty)); return m; }
function returnedMap(batch){ const m={}; (batch.returns||[]).forEach(p=>m[p.threadId]=(m[p.threadId]||0)+num(p.qty)); return m; }
const ACTIVE_MACHINE_STATUS=["scheduled","picked","producing","completed","qcpassed","qcfailed"];
function machineBusy(machineId, start, end, excludeBatchId){
  return state.batches.some(b=> b.id!==excludeBatchId && ACTIVE_MACHINE_STATUS.includes(b.status) &&
    String(b.machineId)===String(machineId) && b.planStart && b.planEnd &&
    !(end < b.planStart || start > b.planEnd));
}
function dueClass(date){
  if(!date) return "";
  const d = daysBetween(todayISO(), date);
  if (d<0) return "due-late";
  if (d<=3) return "due-soon";
  return "";
}
function threadChip(id, extra){
  const t = find(state.threads,id);
  if(!t) return "";
  return '<span class="thread"><i style="background:'+esc(t.color)+'"></i>'+esc(t.name)+
         (extra?(' <b>'+esc(extra)+'</b>'):'')+'</span>';
}

/* ================= 持久化 / 导入导出 ================= */
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = JSON.parse(raw); if(!state||!state.orders) throw 0; return true; }
  }catch(e){ console.warn("存档损坏，改用演示数据", e); }
  return false;
}
function exportData(){
  save();
  const payload = {app:"brocade-workshop", exportedAt:new Date().toISOString(), ...state};
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="织锦工坊备份-"+todayISO()+".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("已导出全部订单、打样、库存、排产与交付记录","ok");
}
$("#importFile").addEventListener("change", e=>{
  const file = e.target.files[0]; e.target.value="";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(reader.result);
      if(!d || !Array.isArray(d.orders) || !Array.isArray(d.flows) || !d.seq)
        throw fail("文件不是本系统导出的备份（缺少 orders / flows / seq 字段）");
      confirmDialog("导入将覆盖本机当前全部数据，确定继续？", ()=>{
        state = Object.assign(freshState(), d);
        save(); renderAll();
        toast("导入完成，记录已还原","ok");
      });
    }catch(err){ toast(err._user?err.message:"导入失败：文件无法解析","err"); }
  };
  reader.readAsText(file);
});
function resetDemo(){
  confirmDialog("将清空当前数据并重新生成演示数据，确定继续？", ()=>{ state=buildDemo(); save(); renderAll(); toast("已载入演示数据","ok"); });
}

/* ================= 业务动作（全部在此拦截） ================= */
function addFlow(flow){
  state.flows.push(Object.assign({id:"f"+state.flows.length+"_"+state.seq.order, at:todayISO(), note:""}, flow));
}
function nextId(prefix, n){ return prefix+n; }

/* ---- 订单 ---- */
function createOrder(form){
  const q = Math.trunc(num(form.qty));
  if(!form.customer.trim()) throw fail("请填写客户名称");
  if(!form.pattern.trim()) throw fail("请填写纹样名称");
  if(q<=0) throw fail("订单数量必须为正整数");
  if(!form.dueDate) throw fail("请选择交期");
  if(form.dueDate < todayISO()) throw fail("交期不能早于今天");
  const o = {id:"o"+Date.now()+Math.floor(Math.random()*1000),
    no:genNo("order","SO-"), customer:form.customer.trim(), pattern:form.pattern.trim(),
    spec:form.spec.trim(), qty:q, unit:form.unit||"匹", dueDate:form.dueDate,
    note:form.note.trim(), createdAt:todayISO()};
  state.orders.unshift(o);
  // 自动建档打样单
  state.proofs.push({id:"p"+o.id, orderId:o.id});
  save(); renderAll();
  toast("订单 "+o.no+" 已录入，打样单已自动建立","ok");
  return o;
}
function editOrder(o, form){
  const q = Math.trunc(num(form.qty));
  if(!form.customer.trim()) throw fail("请填写客户名称");
  if(!form.pattern.trim()) throw fail("请填写纹样名称");
  if(q<=0) throw fail("订单数量必须为正整数");
  const st = orderStats(o);
  if(st.scheduledQty > q)
    throw fail("已生成批次数量 "+qty(st.scheduledQty)+" 大于新订单量 "+qty(q)+"，请先取消多余批次");
  if(st.deliveredQty > q) throw fail("已交付数量已超过新订单量，不能改小");
  Object.assign(o,{customer:form.customer.trim(),pattern:form.pattern.trim(),spec:form.spec.trim(),
    qty,unit:form.unit||"匹",dueDate:form.dueDate,note:form.note.trim()});
  save(); renderAll(); toast("订单已更新","ok");
}

/* ---- 打样版本 ---- */
function requirementInputs(container){
  const rows = container.querySelectorAll(".qrow");
  const reqs = [];
  rows.forEach(r=>{
    const tid = r.querySelector("select").value;
    const qn = num(r.querySelector("input").value);
    if(tid && qn>0) reqs.push({threadId:tid, qty:Math.round(qn*100)/100, unit:r.querySelector(".u").textContent});
  });
  return reqs;
}
function createVersion(proofId, form, container){
  const proof = find(state.proofs,proofId);
  const latest = activeVersion(proof);
  if(latest && latest.status==="passed") throw fail("确认样已通过并锁定，不能再增加版本");
  if(latest && latest.status==="sent") throw fail("当前版本已送样、客户尚未回复，请先登记反馈或退样，再新建版本重打");
  const reqs = requirementInputs(container);
  if(!reqs.length) throw fail("至少登记一种色线及单件用量");
  if(!fv(form,"versionLabel").trim()) throw fail("请填写版本名称（如 初样/二样）");
  const no = state.versions.filter(v=>v.proofId===proofId).length+1;
  const v = {id:"v"+Date.now()+Math.floor(Math.random()*1000), proofId, no,
    label:fv(form,"versionLabel").trim(), weave:fv(form,"weave").trim(), spec:fv(form,"spec").trim(),
    requirements:reqs, status:"draft", sentAt:null, logs:[], createdAt:todayISO()};
  state.versions.push(v);
  v.logs.push({at:todayISO(), text:"建立打样 v"+no+"（"+v.label+"）"});
  save(); renderAll(); toast("打样 v"+no+" 已保存，可继续修订或送样","ok");
}
function updateDraftVersion(v, form, container){
  const reqs = requirementInputs(container);
  if(!reqs.length) throw fail("至少登记一种色线及单件用量");
  v.label=fv(form,"versionLabel").trim()||v.label; v.weave=fv(form,"weave").trim(); v.spec=fv(form,"spec").trim();
  v.requirements=reqs;
  v.logs.push({at:todayISO(), text:"修改草稿规格/色线用量"});
  save(); renderAll(); toast("草稿已更新","ok");
}
function sendVersion(v){
  if(v.status!=="draft" && v.status!=="feedback" && v.status!=="rejected")
    throw fail("只有草稿/已反馈/退样状态可以送样");
  v.status="sent"; v.sentAt=todayISO();
  v.logs.push({at:todayISO(), text:"送样给客户确认"});
  save(); renderAll(); toast("v"+v.no+" 已送样，等待客户反馈","ok");
}
function feedbackVersion(v, text){
  if(v.status!=="sent") throw fail("仅已送样的版本可登记反馈");
  if(!text.trim()) throw fail("请填写客户反馈内容");
  v.status="feedback";
  v.logs.push({at:todayISO(), text:"客户反馈："+text.trim()});
  save(); renderAll(); toast("反馈已记录","ok");
}
function approveVersion(v){
  if(v.status!=="sent" && v.status!=="feedback") throw fail("送样并取得反馈后才能通过");
  v.status="passed"; v.passedAt=todayISO();
  v.logs.push({at:todayISO(), text:"客户确认通过，作为生产确认样锁定"});
  save(); renderAll(); toast("v"+v.no+" 已通过，可生成生产批次","ok");
}
function rejectVersion(v, text){
  if(v.status!=="sent" && v.status!=="feedback") throw fail("送样中的版本才能退样");
  if(!text.trim()) throw fail("请填写退样原因");
  v.status="rejected";
  v.logs.push({at:todayISO(), text:"退样："+text.trim()+"（可新建版本重打）"});
  save(); renderAll(); toast("已退样，可新建版本重打","ok");
}

/* ---- 生产批次 ---- */
function createBatch(orderId, form){
  const o = find(state.orders,orderId);
  const st = orderStats(o);
  if(!st.latest || st.latest.status!=="passed")
    throw fail("确认样尚未通过，不能生成批次排产");
  const q = Math.trunc(num(form.qty));
  if(q<=0) throw fail("批次数量必须为正整数");
  if(q > st.remainSchedule)
    throw fail("超订单数量：本批 "+qty(q)+" 件，仅剩 "+qty(st.remainSchedule)+" 件可排（订单 "+qty(o.qty)+"，已排 "+qty(st.scheduledQty)+"）");
  const b = {id:"b"+Date.now()+Math.floor(Math.random()*1000),
    no:genNo("batch","PB-"), orderId, qty:q,
    status:"created", machineId:null, planStart:"", planEnd:"",
    picks:[], consumes:[], returns:[], qcNote:"", finishedAt:"", createdAt:todayISO()};
  state.batches.unshift(b);
  save(); renderAll(); toast("批次 "+b.no+" 已生成（"+qty(q)+" "+o.unit+"），待排产","ok");
}
function scheduleBatch(b, form){
  if(b.status!=="created" && b.status!=="scheduled") throw fail("当前状态不能排产（防止重复排产）");
  const o = find(state.orders,b.orderId);
  const st = orderStats(o);
  if(!st.latest || st.latest.status!=="passed") throw fail("确认样未通过，禁止排产");
  if(!form.machineId) throw fail("请选择机台");
  if(!form.planStart || !form.planEnd) throw fail("请填写排产起止日期");
  if(form.planEnd < form.planStart) throw fail("完工日期不能早于开工日期");
  if(machineBusy(form.machineId, form.planStart, form.planEnd, b.id))
    throw fail("机台冲突：该机台在 "+form.planStart+" 至 "+form.planEnd+" 已有其他在产批次");
  // 按排产日期重复守卫（同机台同日重复点击由上面区间重叠覆盖）
  b.machineId=form.machineId; b.planStart=form.planStart; b.planEnd=form.planEnd;
  b.status="scheduled";
  save(); renderAll(); toast("批次 "+b.no+" 已排上机台","ok");
}
function assertPickingAvailable(b){
  if(!["scheduled","picked","producing","qcfailed"].includes(b.status))
    throw fail("只有已排产/在产批次可以领料");
  const reqs = batchRequirements(b);
  const picked = pickedMap(b);
  // 余量不足拦截（仅针对尚未领足的计划需求；追加领料在弹窗中逐行再校验库存）
  const shortage = reqs.filter(r=>{
    const t=find(state.threads,r.threadId);
    const bal = t?threadBalance(t.id):0;
    const need = r.qty - (picked[r.threadId]||0);
    return need>0 && bal + 1e-9 < need;
  });
  if(shortage.length){
    const t = find(state.threads,shortage[0].threadId);
    throw fail("色线余量不足："+t.name+" 还需 "+qty(shortage[0].qty-(picked[shortage[0].threadId]||0))+
      "，库存仅 "+qty(threadBalance(t.id))+"，请先入库或调整批次");
  }
}
function confirmPicking(b, rows){
  // rows: [{threadId, qty}] 只出有数量的行
  const reqs = batchRequirements(b);
  const picked = pickedMap(b);
  if(!["scheduled","picked","producing","qcfailed"].includes(b.status)) throw fail("当前状态不能领料");
  for(const r of reqs){
    const row = rows.find(x=>x.threadId===r.threadId);
    const add = row?num(row.qty):0;
    if(add<=0 && !(picked[r.threadId]>0))
      throw fail("请填全领料数量："+find(state.threads,r.threadId).name+" 需 "+qty(r.qty));
    if(add>0){
      const bal = threadBalance(r.threadId);
      if(bal + 1e-9 < add)
        throw fail("领料不足拦截："+find(state.threads,r.threadId).name+" 库存 "+qty(bal)+"，本次要领 "+qty(add));
    }
  }
  rows.forEach(row=>{
    if(!row.threadId || num(row.qty)<=0) return;
    const qn = Math.round(num(row.qty)*100)/100;
    b.picks.push({threadId:row.threadId, qty:qn, at:todayISO()});
    addFlow({threadId:row.threadId, type:"pick", qty:qn, at:todayISO(),
      refType:"batch", refId:b.id, note:b.no+" 领料出库"});
  });
  // 首次领料把批次推进到“已领料”；织造/返工中的追加补领保持原状态
  if(b.status==="scheduled") b.status="picked";
  save(); renderAll(); toast("领料出库已登记并扣减库存","ok");
}
function startWeaving(b){
  if(b.status!=="picked") throw fail("已领料批次才能开工织造（防止跳步）");
  b.status="producing";
  save(); renderAll(); toast(b.no+" 已开工织造","ok");
}
function registerConsume(b, rows){
  if(b.status!=="producing" && b.status!=="qcfailed") throw fail("织造中/返工中的批次才能登记耗用");
  const picked = pickedMap(b), consumed = consumedMap(b), returned = returnedMap(b);
  rows.forEach(row=>{
    const qn = Math.round(num(row.qty)*100)/100;
    if(!row.threadId || qn<=0) return;
    const available = (picked[row.threadId]||0) - (consumed[row.threadId]||0) - (returned[row.threadId]||0) - qn;
    if(available < -1e-9)
      throw fail(find(state.threads,row.threadId).name+" 耗用量超过已领未退数量，不能登记");
    b.consumes.push({threadId:row.threadId, qty:qn, at:todayISO()});
    addFlow({threadId:row.threadId, type:"consume", qty:qn, at:todayISO(),
      refType:"batch", refId:b.id, note:b.no+" 织造耗用（不改变库存）"});
  });
  save(); renderAll(); toast("耗用已登记（库存不变，完工时余线退库）","ok");
}
function finishBatch(b, afterRework){
  if(b.status==="qcfailed"){
    // 返修后重新提交质检：首次完工时余线已退库，这里只转状态，不再重复退线
    b.status="completed"; b.finishedAt=todayISO();
    save(); renderAll(); toast("返修完成，重新进入质检","ok"); return;
  }
  if(b.status!=="producing") throw fail("只有织造中的批次可以登记完工（防止重复完工）");
  // 余线退库：已领 - 已耗
  const picked = pickedMap(b), consumed = consumedMap(b);
  Object.keys(picked).forEach(tid=>{
    const leftover = Math.round(((picked[tid]||0)-(consumed[tid]||0))*100)/100;
    if(leftover>1e-9){
      b.returns.push({threadId:tid, qty:leftover, at:todayISO(), reason:"完工余线退库"});
      addFlow({threadId:tid, type:"return", qty:leftover, at:todayISO(),
        refType:"batch", refId:b.id, note:b.no+" 完工余线退库"});
    }
  });
  b.status="completed"; b.finishedAt=todayISO();
  save(); renderAll(); toast("完工已登记，余线退回库存，等待质检","ok");
}
function qcBatch(b, pass, note){
  if(b.status!=="completed" && b.status!=="qcfailed") throw fail("待质检的批次才能质检");
  if(!pass && !note.trim()) throw fail("质检不合格必须填写返工说明");
  b.qcNote=(b.qcNote?b.qcNote+" ｜ ":"")+(pass?"质检合格：":"质检不合格返工：")+note.trim();
  b.status = pass ? "qcpassed" : "qcfailed";
  save(); renderAll(); toast(pass?"质检合格，可登记交付":"已转返工，可继续登记耗用后再次完工","");
}
function cancelBatch(b, reason){
  if(["delivered","cancelled"].includes(b.status)) throw fail("已交付/已取消批次不能取消");
  if(!reason.trim()) throw fail("请填写取消原因");
  // 退回未耗色线（已领 - 已耗 - 已退）
  const picked=pickedMap(b), consumed=consumedMap(b), returned=returnedMap(b);
  Object.keys(picked).forEach(tid=>{
    const rest = Math.round(((picked[tid]||0)-(consumed[tid]||0)-(returned[tid]||0))*100)/100;
    if(rest>1e-9){
      b.returns.push({threadId:tid, qty:rest, at:todayISO(), reason:"取消生产退回"});
      addFlow({threadId:tid, type:"cancel", qty:rest, at:todayISO(),
        refType:"batch", refId:b.id, note:b.no+" 取消生产退回未耗色线："+reason.trim()});
    }
  });
  b.status="cancelled"; b.cancelReason=reason.trim(); b.cancelledAt=todayISO();
  // 释放机台档期
  b.machineId=null; b.planStart=""; b.planEnd="";
  save(); renderAll(); toast("批次已取消，未耗色线退回库存并留下流水","ok");
}

/* ---- 交付 ---- */
function deliverBatch(b, form){
  if(b.status!=="qcpassed") throw fail("只有质检合格且尚未交付的批次可以交付（防止重复交付）");
  const q = Math.trunc(num(form.qty));
  if(q<=0) throw fail("交付数量必须为正整数");
  const o = find(state.orders,b.orderId);
  const already = orderDeliveries(o.id).reduce((s,d)=>s+num(d.qty),0);
  if(already + q > num(o.qty))
    throw fail("超订单数量拦截：订单 "+qty(o.qty)+"，已交 "+qty(already)+"，本次再交 "+qty(q)+" 将超出 "+qty(already+q-num(o.qty)));
  if(q > num(b.qty)) throw fail("交付数量不能超过本批次数量 "+qty(b.qty));
  const d = {id:"d"+Date.now()+Math.floor(Math.random()*1000),
    no:genNo("delivery","DN-"), batchId:b.id, orderId:b.orderId,
    qty:q, at:form.at, receiver:form.receiver.trim(), note:form.note.trim()};
  state.deliveries.unshift(d);
  b.status="delivered";
  save(); renderAll(); toast("交付单 "+d.no+" 已登记（"+qty(q)+" "+o.unit+"）","ok");
}

function createThread(form){

    addFlow({threadId:t.id,type:"opening",qty:num(form.opening),at:todayISO(),refType:"thread",refId:t.id,note:"期初库存"});

}
function stockIn(form){
  if(!form.threadId) throw fail("请选择色线");
  if(num(form.qty)<=0) throw fail("入库数量必须大于 0");
  addFlow({threadId:form.threadId,type:"instock",qty:Math.round(num(form.qty)*100)/100,
    at:form.at||todayISO(),note:form.note.trim()||"采购入库"});

function adjustStock(form){
  if(!form.threadId) throw fail("请选择色线");
  const delta = Math.round(num(form.qty)*100)/100;
  if(delta===0) throw fail("调整数量不能为 0（盘盈正数 / 盘亏负数）");
  const bal = threadBalance(form.threadId);
  if(bal+delta < -1e-9) throw fail("盘亏后库存为负，不允许调整");
  if(!form.note.trim()) throw fail("盘点调整必须填写原因");
  addFlow({threadId:form.threadId,type:"adjust",qty:delta,at:form.at||todayISO(),note:"盘点调整："+form.note.trim()});

function createMachine(form){

function deleteThread(t){
  if(state.flows.some(f=>f.threadId===t.id)) throw fail("该色线已有库存流水，不能删除（可停用不再选用）");
  state.threads = state.threads.filter(x=>x.id!==t.id);

function deleteMachine(m){
  if(state.batches.some(b=>b.machineId===m.id && b.status!=="cancelled"))
    throw fail("该机台存在未取消批次，不能删除");

/* ================= 待办 / 冲突 / 余量 ================= */
function buildTodos(){
  const todos=[];
  state.orders.forEach(o=>{
    const st=orderStats(o);
    if(st.status==="new") todos.push({type:"待建档打样", cls:"", tab:"proofs", jump:"proof:"+proofOf(o.id).id, text:o.no+" "+o.customer+" · "+o.pattern});
    else if(st.status==="proofing"){
      const v=st.latest;
      if(v.status==="rejected") todos.push({type:"退样待重打", cls:"red", tab:"proofs", jump:"proof:"+st.proof.id, text:o.no+" "+o.pattern+" · v"+v.no+" 已退样"});
      else if(v.status==="sent") todos.push({type:"送样待反馈", cls:"amber", tab:"proofs", jump:"proof:"+st.proof.id, text:o.no+" "+o.pattern+" · v"+v.no+" 送样中"});
      else if(v.status==="draft"||v.status==="feedback") todos.push({type:"样稿待送样", cls:"", tab:"proofs", jump:"proof:"+st.proof.id, text:o.no+" "+o.pattern+" · v"+v.no+" 可送样"});
    }
    else if(st.status==="approved") todos.push({type:"确认样待排产", cls:"green", tab:"batches", jump:"newbatch:"+o.id, text:o.no+" "+o.pattern+" · 剩余可排 "+qty(st.remainSchedule)+" "+o.unit});
    else if(st.deliveredQty < o.qty && daysBetween(todayISO(),o.dueDate)<0 && st.finishedQty < o.qty)
      todos.push({type:"订单已逾期", cls:"red", tab:"orders", jump:"order:"+o.id, text:o.no+" 交期 "+o.dueDate+"，未完工 "+qty(o.qty-st.finishedQty)});
  });
  state.batches.forEach(b=>{
    if(b.status==="created") todos.push({type:"批次待排产", cls:"", tab:"batches", jump:"batch:"+b.id, text:b.no+" · 待选机台日期"});
    else if(b.status==="scheduled") todos.push({type:"待领料开工", cls:"amber", tab:"batches", jump:"pick:"+b.id, text:b.no+" · 已排产待领料"});
    else if(b.status==="picked") todos.push({type:"待开工", cls:"", tab:"batches", jump:"batch:"+b.id, text:b.no+" · 已领色线待织造"});
    else if(b.status==="completed") todos.push({type:"待质检", cls:"amber", tab:"batches", jump:"batch:"+b.id, text:b.no+" · 完工待质检"});
    else if(b.status==="qcpassed") todos.push({type:"质检合格待交付", cls:"green", tab:"delivery", jump:"deliver:"+b.id, text:b.no+" · 合格待交付"});
    else if(b.status==="qcfailed") todos.push({type:"质检返工", cls:"red", tab:"batches", jump:"batch:"+b.id, text:b.no+" · 返工中"});
  });
  return todos;
}
function buildConflicts(){
  const out=[];
  // 1) 待领料批次的色线余量不足
  state.batches.filter(b=>b.status==="scheduled").forEach(b=>{
    const reqs=batchRequirements(b), picked=pickedMap(b);
    reqs.forEach(r=>{
      const need=r.qty-(picked[r.threadId]||0);
      const bal=threadBalance(r.threadId);
      if(need>1e-9 && bal+1e-9<need){
        const t=find(state.threads,r.threadId);
        out.push({kind:"领料不足", cls:"red", tab:"batches", jump:"pick:"+b.id,
          text:b.no+" 的 "+(t?t.name:"?")+" 需 "+qty(need)+"，余量仅 "+qty(bal)});
      }
    });
  });
  // 2) 机台档期重叠（仅在产状态占档期；已交付留档、已取消释放——数据层兜底）
  const live=state.batches.filter(b=>b.machineId && b.planStart && ACTIVE_MACHINE_STATUS.includes(b.status));
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    const a=live[i],c=live[j];
    if(a.machineId===c.machineId && !(a.planEnd<c.planStart || c.planEnd<a.planStart))
      out.push({kind:"机台冲突", cls:"red", tab:"batches", jump:"batch:"+a.id,
        text:a.no+" 与 "+c.no+" 在同一机台档期重叠"});
  }
  // 3) 未排产确认单：按单件需求对比余量（预警，不阻止建档）
  state.orders.forEach(o=>{
    const st=orderStats(o);
    if(st.status==="approved" || st.status==="scheduled"){
      const v=st.latest; if(!v) return;
      versionReqs(v).forEach(r=>{
        const remainQty=Math.max(0,num(o.qty)-st.scheduledQty);
        const need=Math.round(num(r.qty)*remainQty*100)/100;
        const bal=threadBalance(r.threadId);
        if(need>1e-9 && bal+1e-9<need){
          const t=find(state.threads,r.threadId);
          out.push({kind:"后续排产缺线", cls:"amber", tab:"stock", jump:"stockin:"+r.threadId,
            text:o.no+" 未排 "+qty(remainQty)+" 件，"+(t?t.name:"?")+" 约缺 "+qty(need-bal)});
        }
      });
    }
  });
  return out;
}

/* ================= 弹窗 ================= */
function modal(title, bodyHTML, opts){
  opts = opts||{};
  const mask=document.createElement("div");
  mask.className="modal-mask";
  mask.innerHTML='<form class="modal" novalidate><h3><span></span><button class="x" type="button">×</button></h3>'+
    '<div class="body"></div><div class="foot"></div></form>';
  mask.querySelector("h3 span").textContent=title;
  const form=mask.querySelector("form");
  form.querySelector(".body").innerHTML = bodyHTML + '<div class="formerr"></div>';
  const foot=mask.querySelector(".foot");
  function close(){ mask.remove(); }
  mask.querySelector(".x").onclick=close;
  mask.addEventListener("mousedown",e=>{ if(e.target===mask) close(); });
  if(opts.view){
    foot.innerHTML='<button type="button" class="ghost">关闭</button>';
    foot.querySelector("button").onclick=close;
  }else{
    foot.innerHTML='<button type="button" class="ghost cancel">取消</button><button type="submit" class="primary">'+(opts.okText||"确定")+'</button>';
    foot.querySelector(".cancel").onclick=close;
    form.onsubmit=e=>{
      e.preventDefault();
      const errBox=form.querySelector(".formerr");
      try{
        const r = opts.onSubmit(form, close);
        if(r!==false) close();
      }catch(err){
        errBox.textContent=(err._user?err.message:"操作失败："+err.message);
        errBox.classList.add("show");
      }
    };
  }
  document.body.appendChild(mask);
  if(opts.after) opts.after(form);
  return mask;
}
function confirmDialog(text, onOk){

function batchActions(b){
  const a=[];
  a.push('<button class="act" data-act="viewBatch" data-id="'+b.id+'">详情</button>');

  if(b.status==="scheduled") a.push('<button class="act g" data-act="pick" data-id="'+b.id+'">领料</button>');
  if(b.status==="picked") a.push('<button class="act g" data-act="startWeave" data-id="'+b.id+'">开工</button>');
  if(b.status==="producing"||b.status==="qcfailed"){
    a.push('<button class="act" data-act="pick" data-id="'+b.id+'">领料/补领</button>');
    a.push('<button class="act" data-act="consume" data-id="'+b.id+'">登记耗用</button>');
  }
  if(b.status==="producing") a.push('<button class="act g" data-act="finish" data-id="'+b.id+'">完工</button>');
  if(b.status==="qcfailed") a.push('<button class="act g" data-act="finish" data-id="'+b.id+'">返修完工</button>');
  if(b.status==="completed") a.push('<button class="act g" data-act="qc" data-id="'+b.id+'">质检</button>');
  if(b.status==="qcpassed") a.push('<button class="act g" data-act="deliverFromBatch" data-id="'+b.id+'">交付</button>');
  if(!["delivered","cancelled"].includes(b.status)) a.push('<button class="act danger" data-act="cancelBatch" data-id="'+b.id+'">取消</button>');
  return a.join("");
}

function renderStock(){
  let html='<div class="toolbar"><button class="primary" id="newThreadBtn">＋ 新建色线</button>'+
    '<button class="ghost" id="stockInBtn">采购入库</button>'+
    '<button class="ghost" id="adjustBtn">盘点调整</button>'+

      state.threads.map(t=>'<option value="'+t.id+'"'+(ui.stockThread===t.id?" selected":"")+'>'+esc(t.name)+'</option>').join("")+'</select></div>';
  html+='<div class="tablewrap"><table><thead><tr><th>编号</th><th>色线</th><th>单位</th><th>当前余量</th><th>在途占用(已领未耗未退)</th><th>供应</th><th></th></tr></thead><tbody>';
  if(!state.threads.length) html+='<tr><td colspan="7" class="empty">先建立色线档案并录入期初库存</td></tr>';
  state.threads.forEach(t=>{
    const bal=threadBalance(t.id);
    let held=0;
    state.batches.filter(b=>b.status!=="cancelled").forEach(b=>{
      held+=Math.max(0,(pickedMap(b)[t.id]||0)-(consumedMap(b)[t.id]||0)-(returnedMap(b)[t.id]||0));
    });
    held=Math.max(0,Math.round(held*100)/100);
    html+='<tr><td>'+esc(t.no)+'</td><td><span class="thread"><i style="background:'+esc(t.color)+'"></i><b>'+esc(t.name)+'</b></span></td>'+
      '<td>'+esc(t.unit)+'</td><td class="'+(bal<=0?"lowstock":"")+'"><b>'+qty(bal)+'</b></td>'+
      '<td>'+(held>0?qty(held):'<span class="muted">—</span>')+'</td>'+
      '<td class="small">'+esc(t.supplier||"—")+'</td>'+
      '<td><button class="act danger" data-act="delThread" data-id="'+t.id+'">删除</button></td></tr>';
  });
  html+='</tbody></table></div><h2>库存流水账</h2>'+
    '<div class="toolbar"><select id="flowType"><option value="">全部类型</option>'+
      Object.keys(FLOW_TYPES).map(k=>'<option value="'+k+'"'+(ui.flowType===k?" selected":"")+'>'+FLOW_TYPES[k].label+'</option>').join("")+'</select></div>'+
    '<div class="tablewrap"><table><thead><tr><th>日期</th><th>色线</th><th>类型</th><th>数量</th><th>结存余量</th><th>说明</th></tr></thead><tbody>';
  let flows=state.flows.slice().reverse();
  if(ui.stockThread) flows=flows.filter(f=>f.threadId===ui.stockThread);
  if(ui.flowType) flows=flows.filter(f=>f.type===ui.flowType);
  // 结存余量：按时间顺序逐笔累计，用 Map 关联（不修改流水对象，避免污染存档）
  const balances={};
  const balMap=new Map();
  state.flows.forEach(f=>{
    const meta=FLOW_TYPES[f.type];
    balances[f.threadId]=(balances[f.threadId]||0)+(meta?meta.sign*num(f.qty):0);
    balMap.set(f, balances[f.threadId]);
  });
  if(!flows.length) html+='<tr><td colspan="6" class="empty">暂无流水</td></tr>';
  flows.slice(0,200).forEach(f=>{
    const t=find(state.threads,f.threadId);
    const meta=FLOW_TYPES[f.type]||{label:f.type,sign:0};
    const cell=meta.sign>0?'<span class="flow-in">+'+qty(f.qty)+'</span>':meta.sign<0?'<span class="flow-out">-'+qty(f.qty)+'</span>':'<span class="flow-zero">±'+qty(f.qty)+'</span>';
    html+='<tr><td>'+esc(f.at)+'</td><td>'+(t?esc(t.name):"—")+'</td><td>'+esc(meta.label)+'</td>'+
      '<td>'+cell+' '+esc(t?t.unit:"")+'</td><td><b>'+qty(balMap.get(f))+'</b></td><td class="small">'+esc(f.note||"")+'</td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

function renderDelivery(){

    '<option value="done"'+(ui.deliveryFilter==="done"?" selected":"")+'>已交付</option></select></div>';
  const qcBatches=state.batches.filter(b=>["qcpassed","delivered"].includes(b.status));
  let list=qcBatches;

  html+='<div class="tablewrap"><table><thead><tr><th>批次 / 订单</th><th>客户</th><th>批量</th><th>已交</th><th>状态</th><th>操作</th></tr></thead><tbody>';

      '<td>'+(o?esc(o.customer):"—")+'</td><td>'+qty(b.qty)+'</td><td>'+qty(dq)+
        (ds.length?'<div class="small muted">'+ds.map(d=>esc(d.no)+"×"+qty(d.qty)).join("，")+'</div>':"")+'</td>'+
      '<td><span class="chip '+(b.status==="delivered"?"delivered":"qcpassed")+'">'+(b.status==="delivered"?"已交付":"待交付")+'</span></td>'+
      '<td><button class="act g" data-act="deliver" data-id="'+b.id+'">登记交付</button></td></tr>';
  });
  html+='</tbody></table></div><h2>交付记录</h2><div class="tablewrap"><table><thead><tr><th>交付单号</th><th>日期</th><th>订单/批次</th><th>数量</th><th>签收人</th><th>备注</th></tr></thead><tbody>';
  if(!state.deliveries.length) html+='<tr><td colspan="6" class="empty">暂无交付记录</td></tr>';
  state.deliveries.forEach(d=>{
    const o=find(state.orders,d.orderId), b=find(state.batches,d.batchId);
    html+='<tr><td><b>'+esc(d.no)+'</b></td><td>'+esc(d.at)+'</td><td>'+(o?esc(o.no):"")+' / '+(b?esc(b.no):"")+'</td>'+
      '<td>'+qty(d.qty)+' '+(o?esc(o.unit):"")+'</td><td>'+esc(d.receiver||"—")+'</td><td class="small">'+esc(d.note||"—")+'</td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

function openProof(proof){
  const o=find(state.orders,proof.orderId);
  const ps=proofStatusOf(proof);
  const vs=versionsOf(proof.id);
  let body='<div class="small muted">订单 '+esc(o.no)+' · '+esc(o.customer)+' · '+esc(o.pattern)+'（订单量 '+qty(o.qty)+' '+esc(o.unit)+'，交期 '+esc(o.dueDate)+'）</div>';
  body+='<div style="margin:8px 0">当前状态：<span class="chip '+ps.key+'">'+ps.label+'</span>';
  if(ps.key==="passed") body+=' <button type="button" class="act g" id="newBatchBtn">→ 用确认样生成生产批次</button></div>';
  else if(ps.key!=="sent") body+=' <button type="button" class="act g" id="newVerBtn">＋ 新建打样版本</button></div>';
  else body+='</div>';
  if(!vs.length) body+='<div class="empty">还没有版本，点「新建打样版本」保存初样（可保存多个版本）</div>';
  vs.slice().reverse().forEach(v=>{
    body+='<hr><div style="display:flex;justify-content:space-between;align-items:center"><b>v'+v.no+' '+esc(v.label)+'</b>'+versionStatusChip(v.status)+'</div>'+

      '<div class="small muted">送样：'+esc(v.sentAt||"—")+(v.passedAt?' ｜ 通过：'+esc(v.passedAt):"")+'</div>'+
      '<div style="margin-top:6px">'+versionActions(v)+'</div>'+
      '<div>'+v.logs.slice().reverse().map(l=>'<div class="logline"><b>'+esc(l.at)+'</b> '+esc(l.text)+'</div>').join("")+'</div>';
  });
  const m=modal("打样台 · "+o.no+" "+esc(o.pattern), body, {view:true});
  const nb=m.querySelector("#newVerBtn");
  if(nb) nb.onclick=()=>{
    const latest=vs[vs.length-1];
    modal("新建打样版本", versionForm(), {
      okText:"保存版本",
      after:f=>reqBoxSetup(f, latest?versionReqs(latest):[{threadId:"",qty:""}]),
      onSubmit:f=>{ createVersion(proof.id, f, f.querySelector("#reqBox")); reopenProof(proof.id); }
    });
  };
  const nbb=m.querySelector("#newBatchBtn");
  if(nbb) nbb.onclick=()=>openNewBatch(o);
  m.querySelectorAll("[data-vact]").forEach(btn=>btn.onclick=()=>handleVersionAction(btn.dataset.vact, btn.dataset.id));
}
function versionActions(v){
  const a=[];
  if(v.status==="draft") a.push('<button type="button" class="act s" data-vact="editDraft" data-id="'+v.id+'">修改草稿</button>');
  if(["draft","feedback","rejected"].includes(v.status)) a.push('<button type="button" class="act g" data-vact="send" data-id="'+v.id+'">送样</button>');
  if(v.status==="sent") a.push('<button type="button" class="act" data-vact="feedback" data-id="'+v.id+'">登记反馈</button>');
  if(["sent","feedback"].includes(v.status)){
    a.push('<button type="button" class="act g" data-vact="approve" data-id="'+v.id+'">客户通过</button>');
    a.push('<button type="button" class="act danger" data-vact="reject" data-id="'+v.id+'">退样</button>');
  }
  return a.join(" ");
}
function handleVersionAction(act, id){
  const v=find(state.versions,id);
  if(act==="send"){ sendVersion(v); reopenProof(v.proofId); }
  if(act==="feedback") modal("客户反馈 · v"+v.no,
    '<label>反馈内容<span class="req">*</span></label><textarea name="text" placeholder="如 金线偏亮，牡丹花心改为朱红"></textarea>',
    {onSubmit:f=>{ feedbackVersion(v,fv(f,'text')); reopenProof(v.proofId); }});
  if(act==="approve") confirmDialog("确认 v"+v.no+" 通过？通过后该纹样锁定作为生产确认样。",()=>{approveVersion(v); reopenProof(v.proofId);});
  if(act==="reject") modal("退样 · v"+v.no,
    '<label>退样原因<span class="req">*</span></label><textarea name="text" placeholder="如 配色与来样不符，需重打"></textarea>',
    {okText:"确认退样", onSubmit:f=>{ rejectVersion(v,fv(f,'text')); reopenProof(v.proofId); }});
  if(act==="editDraft") modal("修改草稿 · v"+v.no, versionForm(v),{
    okText:"保存修改",
    after:f=>reqBoxSetup(f, versionReqs(v)),
    onSubmit:f=>{ updateDraftVersion(v,f,f.querySelector("#reqBox")); reopenProof(v.proofId); }
  });
}

function openPicking(b){
  // 打开前做余量校验
  try{ assertPickingAvailable(b); }catch(e){ toast(e.message,"err"); return; }
  const extraAllowed=["producing","qcfailed"].includes(b.status);
  const reqs=batchRequirements(b), picked=pickedMap(b);
  const rowsHtml=reqs.map(r=>{
    const remain=Math.round((r.qty-(picked[r.threadId]||0))*100)/100;
    const bal=threadBalance(r.threadId);
    return '<div class="qrow"><span>'+threadChip(r.threadId)+'<span class="small muted">需'+qty(r.qty)+'，已领'+qty(picked[r.threadId]||0)+'，库存'+qty(bal)+'</span></span>'+
      '<input type="number" class="qn" min="0" step="0.01" value="'+(remain>0?remain:"")+'" placeholder="本次领">'+
      '<span class="u">'+esc(r.unit)+'</span><input type="hidden" class="tid" value="'+r.threadId+'"></div>';
  }).join("");
  const extraBox=extraAllowed
    ? '<hr><div class="small muted">返工/在产追加领料（可空白）：</div><div id="extraPick"></div><button type="button" class="act s" id="addExtraRow">＋ 追加色线</button>'
    : "";
  const m=modal((extraAllowed?"追加/补领 · ":"按色线领料 · ")+b.no,
    '<p class="section-note">按确认样单件用量与本批数量折算。库存不足会拦截；可分次领料。</p>'+
    '<div id="pickBox">'+rowsHtml+'</div>'+extraBox,
    {okText:"确认领料出库",
    onSubmit:f=>{
      const rows=[...f.querySelectorAll("#pickBox .qrow")].map(r=>({threadId:r.querySelector(".tid").value,qty:r.querySelector(".qn").value}));
      if(extraAllowed) [...f.querySelectorAll("#extraPick .qrow")].forEach(r=>rows.push({threadId:r.querySelector("select").value,qty:r.querySelector("input").value}));
      confirmPicking(b,rows);
    }});
  if(extraAllowed){
    const box=m.querySelector("#extraPick");
    const addRow=()=>box.insertAdjacentHTML("beforeend",
      '<div class="qrow"><select class="tid-sel">'+threadOptions("",true)+'</select><input type="number" class="qn" min="0" step="0.01" placeholder="追加数量"></div>');
    m.querySelector("#addExtraRow").onclick=addRow;
    m.querySelector("form").onsubmit=e=>{
      e.preventDefault();
      try{
        const rows=[...m.querySelectorAll("#pickBox .qrow")].map(r=>({threadId:r.querySelector(".tid").value,qty:r.querySelector(".qn").value}));
        [...m.querySelectorAll("#extraPick .qrow")].forEach(r=>rows.push({threadId:r.querySelector(".tid-sel").value,qty:r.querySelector(".qn").value}));
        confirmPicking(b,rows); m.remove();
      }catch(err){
        const eb=m.querySelector(".formerr");
        eb.textContent=err._user?err.message:"操作失败："+err.message; eb.classList.add("show");
      }
    };
  }
}

      {onSubmit:f=>stockIn({threadId:fv(f,'threadId'),qty:fv(f,'qty'),at:fv(f,'at'),note:fv(f,'note')})});
  });
  bind("#adjustBtn","click",()=>{
    if(!state.threads.length) return toast("请先建立色线档案","err");
    modal("盘点调整",
      '<label>色线<span class="req">*</span></label><select name="threadId">'+threadOptions("",true)+'</select>'+
      '<label>调整数量（盘盈正 / 盘亏负）<span class="req">*</span></label><input type="number" step="0.01" name="qty">'+
      '<label>原因<span class="req">*</span></label><input name="note" placeholder="如 受潮报损 / 盘点盈余">',
      {onSubmit:f=>adjustStock({threadId:fv(f,'threadId'),qty:fv(f,'qty'),note:fv(f,'note')})});
  });
  bind("#machineMgrBtn","click",openMachineMgr);

  // 总览 / 各表统一动作委托
  document.querySelectorAll("[data-jump]").forEach(el=>el.onclick=()=>handleJump(el.dataset.jump));
  document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>handleAction(el.dataset.act,el.dataset.id));
}
function openMachineMgr(){
  document.querySelectorAll(".modal-mask.machine-mgr").forEach(x=>x.remove());
  let body='<button type="button" class="act g" id="addMachineBtn">＋ 登记新机台</button><hr>'+
    (state.machines.map(m=>'<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0">'+
      '<span><b>'+esc(m.name)+'</b> <span class="muted small">'+esc(m.no)+' 挡车工：'+esc(m.keeper||"—")+'</span></span>'+
      '<button type="button" class="act danger" data-mid="'+m.id+'">删除</button></div>').join("")||'<div class="empty">还没有机台</div>');
  const m=modal("机台档案",body,{view:true});
  m.classList.add("machine-mgr");
  m.querySelector("#addMachineBtn").onclick=()=>modal("登记机台",
    '<label>机台名称<span class="req">*</span></label><input name="name" placeholder="如 一号大花楼木机">'+
    '<label>挡车工/负责人</label><input name="keeper">',
    {okText:"保存机台", onSubmit:f=>{ createMachine({name:fv(f,'name'),keeper:fv(f,'keeper')}); openMachineMgr(); }});
  m.querySelectorAll("[data-mid]").forEach(b=>b.onclick=()=>{
    try{ deleteMachine(find(state.machines,b.dataset.mid)); openMachineMgr(); }
    catch(e){ toast(e.message,"err"); }
  });
}
function handleJump(jump){
  const [tab, ...rest] = jump.split(":");
  const target = rest.join(":");
  ui.tab=tab; renderAll();
  setTimeout(()=>{
    if(!target) return;
    const [kind,id] = target.split(":");
    if(kind==="proof") openProof(find(state.proofs,id));
    else if(kind==="order") openOrder(find(state.orders,id));
    else if(kind==="newbatch") openNewBatch(find(state.orders,id));
    else if(kind==="batch") openBatch(find(state.batches,id));
    else if(kind==="pick") openPicking(find(state.batches,id));
    else if(kind==="deliver") openDeliver(find(state.batches,id));
    else if(kind==="stockin"){
      const t=find(state.threads,id);
      modal("采购入库",'<label>色线</label><select name="threadId">'+threadOptions(t.id,false)+'</select>'+
        '<div class="row"><div><label>数量<span class="req">*</span></label><input type="number" min="0.01" step="0.01" name="qty"></div>'+
        '<div><label>日期</label><input type="date" name="at" value="'+todayISO()+'"></div></div>'+
        '<label>说明</label><input name="note">',
        {onSubmit:f=>stockIn({threadId:fv(f,'threadId'),qty:fv(f,'qty'),at:fv(f,'at'),note:fv(f,'note')})});
    }
  },30);
}
function handleAction(act,id){
  try{
    const o=find(state.orders,id), p=find(state.proofs,id), b=find(state.batches,id), t=find(state.threads,id);
    if(act==="viewOrder") return openOrder(o);
    if(act==="editOrder") return modal("修改订单 · "+o.no,orderForm(o),{okText:"保存修改",onSubmit:f=>editOrder(o,{
      customer:f.customer.value,pattern:f.pattern.value,spec:f.spec.value,qty:f.qty.value,unit:f.unit.value,dueDate:f.dueDate.value,note:f.note.value})});
    if(act==="viewProof") return openProof(p);
    if(act==="viewBatch") return openBatch(b);
    if(act==="schedule") return openSchedule(b);
    if(act==="pick") return openPicking(b);
    if(act==="startWeave") return confirmDialog("确认批次 "+b.no+" 已开工织造？",()=>startWeaving(b));
    if(act==="consume") return openConsume(b);
    if(act==="finish") return confirmDialog("确认 "+b.no+" 完工？系统将把未耗余线退回库存并转待质检。",()=>finishBatch(b));
    if(act==="qc") return openQC(b);
    if(act==="deliver"||act==="deliverFromBatch") return openDeliver(b);
    if(act==="cancelBatch") return modal("取消批次 · "+b.no,
      '<label>取消原因<span class="req">*</span></label><textarea name="reason" placeholder="如 客户撤单 / 纹样重大调整"></textarea>'+
      '<p class="section-note">取消后释放机台档期，已领未耗色线全部退回库存并留下流水。</p>',
      {okText:"确认取消",onSubmit:f=>cancelBatch(b,fv(f,"reason"))});
    if(act==="delThread") return confirmDialog("删除色线「"+t.name+"」？（有流水记录时将被拒绝）",()=>{deleteThread(t);});
  }catch(e){ toast(e._user?e.message:e.message,"err"); }
}

  }

  mkVersion(P1,2,"二样",[req(T.red.id,55,"克"),req(T.gold.id,10,"支"),req(T.ivory.id,42,"克"),req(T.green.id,18,"克")],"passed",

  // O2 部分交付
  let {o:O2,proof:P2}=mkOrder("金陵戏装厂","云凤呈祥","戏装面料，幅宽80cm",8,"匹",offsetDate(6),"");
  mkVersion(P2,1,"初样",[req(T.black.id,70,"克"),req(T.gold.id,16,"支"),req(T.red.id,30,"克")],"passed",
    [{at:offsetDate(-12),text:"建立打样 v1（初样）"},{at:offsetDate(-10),text:"送样"},{at:offsetDate(-8),text:"客户确认通过"}]);

  // O3 织造中
  let {o:O3,proof:P3}=mkOrder("定安戏装厂","海水江崖","袍料，整幅",30,"匹",offsetDate(14),"");
  mkVersion(P3,1,"初样",[req(T.blue.id,80,"克"),req(T.ivory.id,45,"克"),req(T.black.id,25,"克")],"passed",
    [{at:offsetDate(-9),text:"建立打样 v1"},{at:offsetDate(-8),text:"送样"},{at:offsetDate(-6),text:"客户确认通过"}]);

  // O4 已排产待领料（库存足够）
  let {o:O4,proof:P4}=mkOrder("砚窗茶事","岁寒三友","茶席面料，幅宽40cm",60,"幅",offsetDate(21),"");
  mkVersion(P4,1,"初样",[req(T.green.id,36,"克"),req(T.black.id,20,"克"),req(T.ivory.id,18,"克")],"passed",
    [{at:offsetDate(-6),text:"建立打样 v1"},{at:offsetDate(-5),text:"送样"},{at:offsetDate(-3),text:"客户确认通过"}]);

  // O5 质检返工
  let {o:O5,proof:P5}=mkOrder("博物院文创","宝相花","复刻展品，幅宽60cm",4,"匹",offsetDate(10),"");
  mkVersion(P5,1,"初样",[req(T.purple.id,90,"克"),req(T.gold.id,20,"支"),req(T.ivory.id,30,"克")],"passed",
    [{at:offsetDate(-10),text:"建立打样 v1"},{at:offsetDate(-8),text:"送样"},{at:offsetDate(-6),text:"客户确认通过"}]);

  // O6 确认样待排产
  let {o:O6,proof:P6}=mkOrder("沐春堂","瑞鹤图","挂轴面料，幅宽50cm",12,"幅",offsetDate(25),"");
  mkVersion(P6,1,"初样",[req(T.ivory.id,50,"克"),req(T.blue.id,35,"克"),req(T.black.id,20,"克")],"passed",
    [{at:offsetDate(-4),text:"建立打样 v1"},{at:offsetDate(-3),text:"送样"},{at:offsetDate(-1),text:"客户确认通过"}]);

  // O7 打样中——已送样待反馈
  let {o:O7,proof:P7}=mkOrder("澄心堂","八达晕","宋式锦，幅宽70cm",10,"匹",offsetDate(30),"");
  mkVersion(P7,1,"初样",[req(T.red.id,40,"克"),req(T.gold.id,14,"支"),req(T.blue.id,20,"克")],"sent",
    [{at:offsetDate(-3),text:"建立打样 v1"},{at:offsetDate(-1),text:"送样给客户确认"}]);

  // O8 退样待重打 + 逾期
  let {o:O8,proof:P8}=mkOrder("旧街坊布庄","万字曲水","内衬面料，幅宽90cm",50,"米",offsetDate(-1),"价格已锁定");
  mkVersion(P8,1,"初样",[req(T.black.id,12,"克"),req(T.red.id,8,"克")],"rejected",
    [{at:offsetDate(-8),text:"建立打样 v1"},{at:offsetDate(-6),text:"送样"},{at:offsetDate(-4),text:"退样：曲水纹路方向错误，需重打"}]);

  function mkBatch(order,qty,status,daysAgo){
    const b={id:"b"+s.batches.length,no:genNo("batch","PB-"),orderId:order.id,qty,
      status:"created",machineId:null,planStart:"",planEnd:"",picks:[],consumes:[],returns:[],qcNote:"",finishedAt:"",createdAt:offsetDate(-daysAgo)};
    s.batches.push(b); return b;
  }
  function doFlow(type,threadId,qty,b,at,note){
    s.flows.push({threadId,type,qty,at,refType:"batch",refId:b.id,note:b.no+" "+note});
  }
  function schedule(b,m,st,en){ b.machineId=m.id;b.planStart=st;b.planEnd=en;b.status="scheduled"; }
  function pick(b, entries,at){
    entries.forEach(([tid,q])=>{b.picks.push({threadId:tid,qty:q,at});doFlow("pick",tid,q,b,at,"领料出库");});
    b.status="picked";
  }
  function consume(b,entries,at){
    entries.forEach(([tid,q])=>{b.consumes.push({threadId:tid,qty:q,at});doFlow("consume",tid,q,b,at,"织造耗用（不改变库存）");});
    b.status="producing";
  }
  function finish(b,at){
    const pm={},cm={};
    b.picks.forEach(p=>pm[p.threadId]=(pm[p.threadId]||0)+p.qty);
    b.consumes.forEach(p=>cm[p.threadId]=(cm[p.threadId]||0)+p.qty);
    Object.keys(pm).forEach(tid=>{
      const left=Math.round((pm[tid]-(cm[tid]||0))*100)/100;
      if(left>0){b.returns.push({threadId:tid,qty:left,at,reason:"完工余线退库"});doFlow("return",tid,left,b,at,"完工余线退库");}

  const B4=mkBatch(O2,3,"",4); schedule(B4,M2,offsetDate(-2),offsetDate(4));

  // O3: 30匹，B5已排产已领料织造中（15匹，M3）
  const B5=mkBatch(O3,15,"",5); schedule(B5,M3,offsetDate(-2),offsetDate(9));

  // O4: 60幅，B6已排产待领料（20幅，M2未来档期）
  const B6=mkBatch(O4,20,"",3); schedule(B6,M2,offsetDate(5),offsetDate(12));
  // 需求：green 36*20/60=12克，black 20*20/60≈6.67，ivory 6 —— 库存足够

  // O5: 4匹 B7 完工质检不合格返工中（耗了部分线，余线已退库）
  const B7=mkBatch(O5,4,"",8); schedule(B7,M1,offsetDate(-7),offsetDate(-3));
  pick(B7,[[T.purple.id,360],[T.gold.id,80],[T.ivory.id,120]],offsetDate(-7));
  consume(B7,[[T.purple.id,300],[T.gold.id,70],[T.ivory.id,100]],offsetDate(-4));
  finish(B7,offsetDate(-3));
  B7.status="qcfailed"; B7.qcNote="质检不合格返工：局部金线浮长，需补织（"+todayISO()+"）";
  // 返工补领后再耗（耗用不改变库存、只做流水追溯）

  const B8=mkBatch(O4,40,"",2); schedule(B8,M1,offsetDate(13),offsetDate(20));
  // 需求 green=36*40/60=24克? 单件36克 → 36*40/60=24... 实际36*(40/60)=24g 太少。

  const B9=mkBatch(O9,6,"",1); schedule(B9,M3,offsetDate(10),offsetDate(17));
  // black 需求5400克；当前 black ≈ 5200-350(退20)-210(在120)-375(在275)=5200-330-210-375=4285 → 缺约1115
  // gold 需求360支；gold=900-100(退4)-100(退3)-80(退4)-48(在28)-80(在10)=900-96-97-76-48-70=513 → 缺
  return s;
}
